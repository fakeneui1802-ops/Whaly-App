name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > whaly-release.jks
            cat > keystore.properties <<EOF
          storeFile=whaly-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          fi

      - name: Build release
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="dev-${GITHUB_RUN_NUMBER}"; fi
          cp app/build/outputs/apk/release/app-release.apk "Whaly-$VERSION.apk"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: Whaly-*.apk
          generate_release_notes: true
